{% load static %}
<section class="section section--alt gurucool-promo" id="gurucool" aria-labelledby="gurucool-title">
    <div class="container">
        <header class="section__header section__header--center">
            <p class="section__eyebrow">{{ gurucool.eyebrow }}</p>
            <h2 id="gurucool-title" class="section__title">{{ gurucool.title }}</h2>
        </header>
        <div class="gurucool-promo__stack">
            {% for slide in gurucool.slides %}
                <figure class="gurucool-promo__item">
                    <img
                        src="{% static slide.image %}"
                        alt="{{ slide.alt }}"
                        loading="lazy"
                        decoding="async"
                    >
                </figure>
            {% endfor %}
        </div>
        <p class="gurucool-promo__contact">
            <a href="https://wa.me/{{ gurucool.whatsapp }}" target="_blank" rel="noopener noreferrer">WhatsApp: {{ gurucool.whatsapp_display }}</a>
            ·
            <a href="mailto:{{ gurucool.email }}">{{ gurucool.email }}</a>
        </p>
    </div>
</section>
