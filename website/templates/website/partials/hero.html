<section class="hero" aria-labelledby="hero-title">
    <div class="hero__bg" aria-hidden="true">
        <span class="hero__orb hero__orb--1"></span>
        <span class="hero__orb hero__orb--2"></span>
    </div>
    <div class="container hero__inner">
        <p class="hero__eyebrow">
            <span class="hero__eyebrow-badge">{{ site.tagline }}</span>
        </p>
        <h1 id="hero-title" class="hero__title">{{ site.name }}</h1>
        <p class="hero__headline">{{ site.headline }}</p>
        <p class="hero__description">{{ site.description }}</p>
        <a href="#innovation" class="btn btn--primary">Explore Our Work</a>
    </div>
</section>
