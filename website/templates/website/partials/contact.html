<section class="section section--contact" id="contact" aria-labelledby="contact-title">
    <div class="container">
        <div class="contact">
            <div class="contact__info">
                <p class="section__eyebrow">Get in Touch</p>
                <h2 id="contact-title" class="section__title">{{ contact.title }}</h2>
                <p class="contact__body">{{ contact.body }}</p>
            </div>

            <div class="contact__form-wrap">
                <div id="contact-alert" class="contact-alert" hidden role="status"></div>

                <form
                    id="contact-form"
                    class="contact-form"
                    action="{% url 'contact_submit' %}"
                    method="post"
                    novalidate
                >
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="id_name">Name</label>
                        {{ form.name }}
                        <span class="form-error" data-error="name" hidden></span>
                    </div>
                    <div class="form-group">
                        <label for="id_email">Email</label>
                        {{ form.email }}
                        <span class="form-error" data-error="email" hidden></span>
                    </div>
                    <div class="form-group">
                        <label for="id_message">Message</label>
                        {{ form.message }}
                        <span class="form-error" data-error="message" hidden></span>
                    </div>
                    <button type="submit" class="btn btn--primary btn--full" id="contact-submit">
                        Get in Touch
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
