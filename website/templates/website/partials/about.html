<section class="section section--about" id="about" aria-labelledby="about-title">
    <div class="container">
        <div class="section__header section__header--center">
            <p class="section__eyebrow">Who We Are</p>
            <h2 id="about-title" class="section__title">{{ about.title }}</h2>
        </div>

        <div class="about__content">
            <p class="about__body">{{ about.body }}</p>
            <p class="about__vision">{{ about.vision_intro }}</p>
            <div class="about__domains">
                {% for domain in about.domains %}
                    <span class="about__domain">{{ domain }}</span>
                {% endfor %}
            </div>
        </div>
    </div>
</section>
