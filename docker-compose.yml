services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: "587"
      EMAIL_USE_TLS: "True"
      EMAIL_HOST_USER: gnovatech2026@gmail.com
      CONTACT_RECIPIENT_EMAIL: gnovatech2026@gmail.com
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
    restart: unless-stopped

volumes:
  staticfiles:
